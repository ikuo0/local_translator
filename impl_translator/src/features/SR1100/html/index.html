<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SR1100 テキスト翻訳</title>
    <link rel="stylesheet" href="style.css">
    <script src="translate.js" defer></script>
</head>
<body>
<main>
    <a href="/">機能一覧</a>
    <h1>テキスト翻訳</h1>
    <form id="translate-form">
        <label for="direction">翻訳方向</label>
        <select id="direction">
            <option value="en-ja">英語 → 日本語</option>
            <option value="ja-en">日本語 → 英語</option>
        </select>
        <div class="panels">
            <div>
                <label for="source">原文</label>
                <textarea id="source" required></textarea>
            </div>
            <div>
                <label for="translation">翻訳結果</label>
                <textarea id="translation" readonly></textarea>
            </div>
        </div>
        <button id="submit" type="submit">翻訳する</button>
        <p id="status" role="status"></p>
    </form>
</main>
</body>
</html>
