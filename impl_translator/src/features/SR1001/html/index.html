<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SR1001 ジョブ進捗</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #172334; background: #f2f5f9; }
        body { margin: 0; }
        main { max-width: 72rem; margin: 0 auto; padding: 2rem 1rem; }
        h1 { margin: 0 0 1.25rem; font-size: 1.8rem; }
        h2 { margin-top: 0; font-size: 1.15rem; }
        form { display: flex; align-items: end; gap: .65rem; flex-wrap: wrap; }
        label { display: grid; gap: .3rem; }
        input, button { font: inherit; padding: .55rem .7rem; border-radius: .4rem; }
        input { width: min(24rem, 70vw); border: 1px solid #8d9bab; }
        button { cursor: pointer; border: 1px solid #205b96; color: white; background: #205b96; }
        section { background: white; border: 1px solid #d6dee8; border-radius: .65rem; padding: 1rem; margin-top: 1rem; }
        dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .35rem 1rem; }
        dt { color: #455469; }
        dd { margin: 0; overflow-wrap: anywhere; }
        progress { width: 100%; accent-color: #205b96; }
        .table-scroll { overflow: auto; max-height: 34rem; }
        table { border-collapse: collapse; width: 100%; font-size: .88rem; }
        th, td { padding: .45rem .55rem; border-bottom: 1px solid #dde4ed; text-align: left; }
        th { position: sticky; top: 0; background: #edf2f8; white-space: nowrap; }
        td:nth-child(-n+7) { white-space: nowrap; }
        .error, td[data-state="failed"], td[data-state="interrupted"] { color: #a32020; }
        td[data-state="running"] { color: #925600; }
        td[data-state="completed"] { color: #17613e; }
    </style>
</head>
<body>
<main>
    <h1>SR1001 ジョブ進捗</h1>
    <form id="job-form">
        <label>ジョブ ID <input id="job-id" required autocomplete="off" spellcheck="false"></label>
        <button type="submit">表示・更新</button>
    </form>
    <p id="error" role="alert" class="error" hidden></p>

    <div id="report" hidden>
        <section aria-labelledby="progress-title">
            <h2 id="progress-title">ページ進捗</h2>
            <dl>
                <dt>ジョブ</dt><dd id="display-id"></dd>
                <dt>状態</dt><dd id="status"></dd>
                <dt>対象ページ</dt><dd id="selection"></dd>
                <dt>進捗</dt><dd id="counts"></dd>
                <dt>最終更新</dt><dd id="updated"></dd>
                <dt>ジョブ経過時間</dt><dd id="elapsed"></dd>
                <dt>ページ処理の残り時間</dt><dd id="remaining"></dd>
                <dt>完了ページの計測</dt><dd id="timing"></dd>
            </dl>
            <progress id="progress" max="100" value="0" aria-label="完了ページの割合"></progress>
        </section>
        <section aria-labelledby="export-title">
            <h2 id="export-title">SF005 成果物の出力</h2>
            <dl>
                <dt>状態</dt><dd id="export-status"></dd>
                <dt>処理時間</dt><dd id="export-time"></dd>
            </dl>
            <p id="export-error" class="error" hidden></p>
            <dl id="outputs" hidden></dl>
        </section>
        <section aria-labelledby="pages-title">
            <h2 id="pages-title">ページ別の処理時間</h2>
            <div class="table-scroll" tabindex="0" aria-label="ページ別の計測一覧">
                <table>
                    <thead>
                        <tr><th>ページ</th><th>状態</th><th>合計</th><th>SF001</th><th>SF002</th><th>SF003</th><th>SF004</th><th>エラー</th></tr>
                    </thead>
                    <tbody id="pages"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<script>
    const element = (id) => document.getElementById(id);
    const setText = (id, value) => { element(id).textContent = value; };
    const seconds = (value) => Number.isFinite(value) ? value.toFixed(2) + ' 秒' : '—';
    const labels = {
        pending: '未着手', running: '処理中', progress: '処理中',
        awaiting_export: '成果物の出力待ち', pages_completed: 'ページ処理完了',
        completed: '完了', complete: '完了', failed: '失敗', error: '失敗',
        interrupted: '中断', unknown: '記録なし'
    };
    const label = (status) => labels[status] ?? status;
    const phases = ['sf001', 'sf002', 'sf003', 'sf004'];
    let activeJob = '';
    let latestRequest = 0;
    let loading = false;

    function render(report) {
        setText('display-id', report.job_id);
        setText('status', label(report.status));
        const range = report.selection;
        setText('selection', range
            ? `${range.start_page}–${range.end_page} / 全 ${range.document_page_count} ページ`
            : `${report.total_pages} ページ`);
        setText('counts', `完了 ${report.completed}/${report.total_pages}（${report.progress_percent}%） · 処理中 ${report.running} · 未着手 ${report.pending} · 失敗 ${report.failed} · 中断 ${report.interrupted}`);
        element('progress').value = report.progress_percent;
        setText('updated', report.updated_at ? new Date(report.updated_at).toLocaleString() : '—');
        setText('elapsed', seconds(report.elapsed_seconds));
        const remaining = report.estimated_remaining_seconds;
        setText('remaining', Number.isFinite(remaining)
            ? `約 ${Math.ceil(remaining / 60)} 分`
            : report.running ? '計測中' : '—');
        const timing = report.summary;
        setText('timing', timing.timed_completed_pages
            ? `${timing.timed_completed_pages} ページ · 平均 ${seconds(timing.avg_elapsed_seconds)} · 最短 ${seconds(timing.min_elapsed_seconds)} · 最長 ${seconds(timing.max_elapsed_seconds)} · 合計 ${seconds(timing.total_elapsed_seconds)}`
            : '記録なし');

        const output = report.sf005;
        setText('export-status', output.error === 'Interrupted' ? '中断' : label(output.status));
        setText('export-time', seconds(output.stats?.duration_sec));
        setText('export-error', output.error ?? '');
        element('export-error').hidden = !output.error;
        const paths = Object.entries(output.outputs ?? {});
        element('outputs').hidden = paths.length === 0;
        element('outputs').replaceChildren(...paths.flatMap(([name, path]) => {
            const key = document.createElement('dt');
            const value = document.createElement('dd');
            key.textContent = name;
            value.textContent = path;
            return [key, value];
        }));

        const rows = document.createDocumentFragment();
        for (const [number, page] of Object.entries(report.pages)) {
            const row = document.createElement('tr');
            const values = [number, label(page.status), seconds(page.elapsed_seconds),
                ...phases.map((phase) => seconds(page.stats?.phases?.[phase]?.duration_sec)),
                page.error ?? '—'];
            values.forEach((value, index) => {
                const cell = row.insertCell();
                cell.textContent = value;
                if (index === 1) cell.dataset.state = page.status;
            });
            rows.appendChild(row);
        }
        element('pages').replaceChildren(rows);
        element('report').hidden = false;
    }

    async function refresh() {
        const request = ++latestRequest;
        loading = true;
        try {
            const response = await fetch(`/sr1001/api/job/${encodeURIComponent(activeJob)}`, {cache: 'no-store'});
            const report = await response.json();
            if (request !== latestRequest) return;
            if (!response.ok) throw new Error(report.error ?? `HTTP ${response.status}`);
            render(report);
            element('error').hidden = true;
        } catch (error) {
            if (request !== latestRequest) return;
            setText('error', error.message);
            element('error').hidden = false;
        } finally {
            if (request === latestRequest) loading = false;
        }
    }

    element('job-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const jobId = element('job-id').value.trim();
        if (!jobId) return;
        if (activeJob !== jobId) element('report').hidden = true;
        activeJob = jobId;
        refresh();
    });
    const query = new URLSearchParams(location.search);
    activeJob = (query.get('id') ?? query.get('job_id') ?? '').trim();
    if (activeJob) {
        element('job-id').value = activeJob;
        refresh();
    }
    setInterval(() => {
        if (activeJob && !loading) refresh();
    }, 3000);
</script>
</body>
</html>
