<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>impl_translator - 目次</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .feature-card {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: block;
        }
        .feature-card:hover {
            border-color: #667eea;
            background-color: #f5f7ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }
        .feature-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .feature-description {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 10px;
        }
        .feature-code {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #764ba2;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 impl_translator</h1>
        <p class="subtitle">PDF翻訳システム - モジュール目次</p>

        <div class="features">
            <a href="/sr1001/" class="feature-card">
                <div class="feature-title">📊 SR1001 - ジョブ進捗監視</div>
                <div class="feature-description">
                    PDF翻訳ジョブの進捗状況をリアルタイム監視します。
                    ページごとの翻訳状況とジョブの全体進捗を確認できます。
                </div>
                <div class="feature-code">/sr1001/</div>
            </a>
        </div>

        <div class="footer">
            <p>impl_translator v1.0 | PDF Translation System powered by Qwen3 8B</p>
        </div>
    </div>
</body>
</html>
